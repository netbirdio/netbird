post:
  summary: Add Peers to a Group
  description: Adds the given peers to a group in a single request. Peers that are already members are ignored. If any ID is unknown, nothing is changed.
  tags: [ Groups ]
  security:
    - BearerAuth: [ ]
    - TokenAuth: [ ]
  parameters:
    - in: path
      name: groupId
      required: true
      schema:
        type: string
      description: The unique identifier of a group
  requestBody:
    description: Peer IDs to add to the group
    required: true
    content:
      'application/json':
        schema:
          $ref: './components.yaml#/components/schemas/GroupPeersRequest'
  responses:
    '200':
      description: The updated Group object
      content:
        application/json:
          schema:
            $ref: './components.yaml#/components/schemas/Group'
    '400':
      "$ref": '../openapi.yaml#/components/responses/bad_request'
    '401':
      "$ref": '../openapi.yaml#/components/responses/requires_authentication'
    '403':
      "$ref": '../openapi.yaml#/components/responses/forbidden'
    '404':
      "$ref": '../openapi.yaml#/components/responses/not_found'
    '422':
      "$ref": '../openapi.yaml#/components/responses/unprocessable'
    '500':
      "$ref": '../openapi.yaml#/components/responses/internal_error'
delete:
  summary: Remove Peers from a Group
  description: Removes the given peers from a group in a single request. IDs that are not members are ignored. If any ID is unknown, nothing is changed.
  tags: [ Groups ]
  security:
    - BearerAuth: [ ]
    - TokenAuth: [ ]
  parameters:
    - in: path
      name: groupId
      required: true
      schema:
        type: string
      description: The unique identifier of a group
  requestBody:
    description: Peer IDs to remove from the group
    required: true
    content:
      'application/json':
        schema:
          $ref: './components.yaml#/components/schemas/GroupPeersRequest'
  responses:
    '200':
      description: The updated Group object
      content:
        application/json:
          schema:
            $ref: './components.yaml#/components/schemas/Group'
    '400':
      "$ref": '../openapi.yaml#/components/responses/bad_request'
    '401':
      "$ref": '../openapi.yaml#/components/responses/requires_authentication'
    '403':
      "$ref": '../openapi.yaml#/components/responses/forbidden'
    '404':
      "$ref": '../openapi.yaml#/components/responses/not_found'
    '422':
      "$ref": '../openapi.yaml#/components/responses/unprocessable'
    '500':
      "$ref": '../openapi.yaml#/components/responses/internal_error'
