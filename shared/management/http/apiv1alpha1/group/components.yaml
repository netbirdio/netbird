components:
  schemas:
    GroupMinimum:
      type: object
      properties:
        id:
          description: Group ID
          type: string
          example: ch8i4ug6lnn4g9hqv7m0
        name:
          description: Group Name identifier
          type: string
          example: devs
        peers_count:
          description: Count of peers associated to the group
          type: integer
          example: 2
        resources_count:
          description: Count of resources associated to the group
          type: integer
          example: 5
        issued:
          description: How the group was issued (api, integration, jwt)
          type: string
          enum: [ "api", "integration", "jwt" ]
          example: api
      required:
        - id
        - name
        - peers_count
        - resources_count
    GroupRequest:
      type: object
      properties:
        name:
          type: string
          description: Group name identifier
          example: devs
        peers:
          type: array
          description: List of peers ids
          items:
            type: string
            example: "ch8i4ug6lnn4g9hqv7m1"
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
      required:
        - name
    Group:
      allOf:
        - $ref: '#/components/schemas/GroupMinimum'
        - type: object
          properties:
            peers:
              description: List of IDs of the group's peers that the caller is allowed to see
              type: array
              items:
                type: string
                example: "chacbco6lnnbn6cg5s90"
            resources:
              type: array
              items:
                $ref: '#/components/schemas/Resource'
          required:
            - peers
            - resources
    GroupPeersRequest:
      type: object
      properties:
        peer_ids:
          description: List of peer IDs to add to or remove from the group
          type: array
          minItems: 1
          items:
            type: string
            example: "chacbco6lnnbn6cg5s90"
      required:
        - peer_ids
    Resource:
      type: object
      properties:
        id:
          description: ID of the resource
          type: string
          example: chacdk86lnnboviihd7g
        type:
          $ref: '#/components/schemas/ResourceType'
      required:
        - id
        - type
    ResourceType:
      description: Type of the resource
      type: string
      enum: [ "host", "subnet", "domain", "peer" ]
      example: peer
