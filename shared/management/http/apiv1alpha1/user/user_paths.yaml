UsersPath:
  get:
    summary: List all Users
    description: Returns a list of all users
    tags: [ Users ]
    security:
      - BearerAuth: [ ]
      - TokenAuth: [ ]
    parameters:
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        description: Number of users per page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 250
          default: 100
      - in: query
        description: filter users by name
        name: name
        minLength: 5
        maxLength: 32
        required: false
        schema:
          type: string
      - in: query
        name: service_user
        schema:
          type: boolean
        description: Filters users and returns either regular users or service users
      - in: query
        name: pending_approval
        schema:
          type: boolean
        description: Filters users by whether they are waiting for approval
      - in: query
        name: role
        required: false
        description: Filters users by role, matching any of the given roles
        schema:
          type: array
          items:
            type: string
            enum:
              - owner
              - admin
              - user
              - network_admin
              - billing_admin
              - auditor
              - agent_network_admin
              - usage_viewer
      - in: query
        name: group_ids
        required: false
        description: Filters users whose auto groups contain any of the given group IDs
        schema:
          type: array
          items:
            type: string
      - in: query
        name: user_ids
        required: false
        description: Filters users by ID
        schema:
          type: array
          items:
            type: string
      - in: query
        name: sort_by
        required: false
        description: Sorting of users, as field or field,order. Users are always sorted by ID last.
        example: sort_by=is_current,desc&sort_by=last_login,desc
        schema:
          type: array
          items:
            type: string
            enum:
              - is_current
              - role
              - last_login
              - asc
              - desc
    responses:
      '200':
        description: A page of Users
        content:
          application/json:
            schema:
              $ref: './user_components.yaml#/components/schemas/UserBatch'
      '400':
        "$ref": "../openapi.yaml#/components/responses/bad_request"
      '401':
        "$ref": "../openapi.yaml#/components/responses/requires_authentication"
      '403':
        "$ref": "../openapi.yaml#/components/responses/forbidden"
      '422':
        "$ref": "../openapi.yaml#/components/responses/unprocessable"
      '500':
        "$ref": "../openapi.yaml#/components/responses/internal_error"