<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetBird</title>
    <style>
      html, body { background: #F3F3F3; }
      @media (prefers-color-scheme: dark) { html, body { background: #181A1D; } }
      html.dark, html.dark body { background: #181A1D; }
      html.light, html.light body { background: #F3F3F3; }
    </style>
    <script>
      // Pre-paint theme guard: apply the persisted preference before first
      // render to avoid a flash of the wrong theme.
      (function () {
        try {
          var pref = localStorage.getItem("nb-theme-pref") || "system";
          var dark;
          if (pref === "dark") dark = true;
          else if (pref === "light") dark = false;
          else dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.classList.toggle("light", !dark);
        } catch (e) {
          /* leave class unset - media query follows the system */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app.tsx"></script>
  </body>
</html>
