name: MCP E2E

on:
  pull_request:
    paths:
      - '.github/workflows/mcp-e2e.yml'
      - 'management/internals/modules/mcpapi/**'
      - 'management/internals/server/**'
      - 'management/server/http/middleware/**'
      - 'management/server/idp/**'
      - 'shared/management/http/api/**'
      - 'idp/**'
      - 'e2e/harness/**'
      - 'e2e/mcp/**'
      - 'combined/**'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Cache Docker layers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/.mcp-buildx-cache
          key: ${{ runner.os }}-mcp-e2e-${{ hashFiles('go.sum', 'combined/Dockerfile.multistage') }}
          restore-keys: |
            ${{ runner.os }}-mcp-e2e-

      - name: Run MCP E2E
        env:
          NB_E2E_BUILDX_CACHE: /tmp/.mcp-buildx-cache
        run: go test -tags e2e -timeout 25m -v ./e2e/mcp/... ./e2e/harness/...
