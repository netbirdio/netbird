name: Test installation

on:
  push:
    branches:
      - main
      - "release-*"
  pull_request:
    paths:
      - "release_files/install.sh"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || github.actor_id }}
  cancel-in-progress: true
jobs:
  test-install-script:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        skip_ui_mode: [true, false]
        install_binary: [true, false]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: run install script
        env:
          SKIP_UI_APP: ${{ matrix.skip_ui_mode }}
          USE_BIN_INSTALL: ${{ matrix.install_binary }}
          GITHUB_TOKEN: ${{ secrets.RO_API_CALLER_TOKEN }}
        run: |
          [ "$SKIP_UI_APP" == "false" ] && export XDG_CURRENT_DESKTOP="none"
          cat release_files/install.sh | sh -x

      - name: check cli binary
        run: command -v netbird

      - name: check ui binary
        if: ${{ runner.os == 'Linux' && runner.arch != 'ARM64' && !matrix.skip_ui_mode }}
        run: command -v netbird-ui

  test-install-script-arm64-ui-unavailable:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: run install script
        shell: bash
        env:
          # Pinned to a release that ships no Linux arm64 UI archive, so the UI
          # download keeps failing here after newer releases start shipping one.
          NETBIRD_RELEASE: v0.83.1
          USE_BIN_INSTALL: true
          SKIP_UI_APP: false
          XDG_CURRENT_DESKTOP: none
          GITHUB_TOKEN: ${{ github.token }}
        run: sh -x release_files/install.sh 2>&1 | tee install.log

      - name: check cli binary
        run: command -v netbird

      - name: check ui install was skipped with a warning
        run: |
          grep -q "Continuing with the NetBird CLI only" install.log
          if command -v netbird-ui; then
            echo "netbird-ui must not be installed when its download fails"
            exit 1
          fi
