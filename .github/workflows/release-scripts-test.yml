name: Test release scripts

on:
  push:
    branches:
      - main
      - "release-*"
    paths:
      - "release_files/skip-latest.sh"
      - "release_files/tests/**"
      - ".github/workflows/release-scripts-test.yml"
  pull_request:
    paths:
      - "release_files/skip-latest.sh"
      - "release_files/tests/**"
      - ".github/workflows/release-scripts-test.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || github.actor_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run bats
        run: bats release_files/tests/
