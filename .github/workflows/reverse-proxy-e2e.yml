name: Reverse Proxy E2E

on:
  pull_request:
    paths:
      - '.github/workflows/reverse-proxy-e2e.yml'
      - '**/*.go'
      - 'e2e/**'
      - 'shared/management/**'
      - 'combined/Dockerfile*'
      - 'proxy/Dockerfile*'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reverse-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.reverse-proxy-buildx-cache
          key: ${{ runner.os }}-reverse-proxy-e2e-${{ hashFiles('go.sum', 'combined/Dockerfile.multistage', 'proxy/Dockerfile.multistage') }}
          restore-keys: |
            ${{ runner.os }}-reverse-proxy-e2e-

      - name: Run reverse-proxy E2E
        env:
          NB_E2E_BUILDX_CACHE: /tmp/.reverse-proxy-buildx-cache
        run: go test -tags e2e -timeout 25m -v ./e2e/reverseproxy/...
